name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.browser.txt
      - run: pip install -r requirements.browser.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run the production browser accessibility matrix
        shell: bash
        run: |
          npm run start -- -p 3199 > /tmp/campushire-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3199/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              cat /tmp/campushire-frontend.log
              exit 1
            fi
            sleep 1
          done
          npm run test:accessibility
      - name: Build the production frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://staging.invalid/api/v1 --tag campushire-frontend:test .
      - run: npm audit --audit-level=high
      - name: Check out the mirrored Backend phase-10 controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: painjanevivek/CampusHire-backend
          ref: 1f41c8118141094557fdda4a32f2265236eb158f
          path: .compat/backend
          persist-credentials: false
      - name: Validate the cross-repository pilot compatibility manifest
        run: |
          python .github/tests/test_validate_compatibility_manifest.py
          python .github/scripts/validate_compatibility_manifest.py --frontend . --backend .compat/backend
