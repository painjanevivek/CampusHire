name: Publish frontend image

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public HTTPS API URL compiled into the frontend image
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/campushire-frontend

jobs:
  publish:
    name: Publish immutable frontend image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require an HTTPS API URL
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["API_URL"]
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.netloc or parsed.fragment:
              raise SystemExit("api_url must be an absolute HTTPS URL without a fragment")
          PY

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
          cache-from: type=gha,scope=campushire-frontend
          cache-to: type=gha,mode=max,scope=campushire-frontend
          provenance: mode=max
          sbom: true

      - name: Record the immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Frontend image"
            echo
            echo "\`${IMAGE_NAME}@${DIGEST}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
